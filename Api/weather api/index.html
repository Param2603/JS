<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather-api</title>
  </head>

  <body>
    <input id="text" type="text" placeholder="Enter City Name"/>
    <button id="btn">search</button><br><br>
    
    <div id="container"></div>
    <script>
      const textInput = document.getElementById("text");
      const searchBtn = document.querySelector("#btn");
      const container = document.getElementById("container");

      async function getData() {
        let inputWeather = textInput.value;
        container.innerHTML = "";
        try {
          const apikey = "ff785b71dfd84fcb6b6c14f23c502c1f";
      
          let data = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?units=metric&q=${inputWeather}&appid=${apikey}`
          );
          let result = await data.json();
          console.log(result);
          let cityName = document.createElement("h2");
          let temperature = document.createElement("p");
          let timezone = document.createElement("p")
          let visibility = document.createElement("p")
          
          cityName.innerHTML = `City Name : ${result.name}`;
          temperature.innerText = `Temperature: ${result.main.temp}°C`;
          temperature.style.color = "red"
          timezone.innerHTML = `Timezone : ${result.timezone}`
          timezone.style.color = "green"
          visibility.innerHTML = `Visibility : ${result.visibility}`
          visibility.style.color ="magenta"
       
          container.append(cityName, temperature, timezone, visibility);
        } catch (e) {
          console.log(e);
        }
      }
      searchBtn.addEventListener("click", getData);
    </script>
  </body>
</html>
