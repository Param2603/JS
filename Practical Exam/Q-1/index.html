<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <h1>Task Manager</h1>

  <div class="task-form">
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="description" placeholder="Description">
    <input type="date" id="dueDate">
    <ul id="priority" class="priority-list">
      <li data-value="low">Low</li>
      <li data-value="medium">Medium</li>
      <li data-value="high">High</li>
    </ul>
    <button onclick="addTask()">Add Task</button>
  </div>

  <div class="filter">
    <label for="filterPriority">Filter by Priority:</label>
    <select id="filterPriority" onchange="displayTasks()">
      <option value="all">All</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <div class="task-list" id="taskList">

  </div>

  <script src="./script.js"></script>
</body>

</html>
